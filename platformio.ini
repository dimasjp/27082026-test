; PlatformIO build configuration.
;
; The sketch also opens directly in the Arduino IDE — open RumahPompa/RumahPompa.ino.
; `src_dir` below points PlatformIO at that same folder so the two toolchains
; share one copy of the source.

[platformio]
src_dir = RumahPompa

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    blynkkk/Blynk@^1.3.2

; The sketch compiles against both Arduino-ESP32 2.x and 3.x — the watchdog
; setup is guarded on ESP_ARDUINO_VERSION_MAJOR. The `espressif32` platform
; above tracks the 2.x core; for the 3.x core, replace the platform line with
; the community pioarduino build, for example:
;
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
